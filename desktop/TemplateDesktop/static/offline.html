<!doctype html>
<!--
  Gerege Template Platform V3.0
  Gerege Systems Development Team болон Claude AI хамтран бүтээв, 2026.

  Сервер хүрэхгүй үед харагдах дотоод хуудас. Web аппын хэсэг БИШ.
-->
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Холбогдож чадсангүй</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- Гарчгийн мөргүй (macOS hiddenInset) цонхонд ачаалагдвал дээд талд чирэх
         бүс хэрэгтэй — эс бөгөөс цонхыг зөөх газаргүй болно. Стандарт хүрээтэй
         Windows/Linux дээр offline.js үүнийг асаахгүй. -->
    <div class="drag-strip" aria-hidden="true"></div>
    <main class="screen">
      <div class="card">
        <h1 class="screen__title">Сервертэй холбогдож чадсангүй</h1>
        <p class="screen__lead">
          Интернэт холболтоо шалгана уу. Асуудал үргэлжилбэл серверийн хаяг зөв
          эсэхийг нягтална уу.
        </p>

        <dl class="detail">
          <dt>Хаяг</dt>
          <dd class="mono" id="origin">—</dd>
          <dt>Шалтгаан</dt>
          <dd class="mono" id="reason">—</dd>
        </dl>

        <div class="actions">
          <button type="button" class="btn btn--primary" id="retry">Дахин оролдох</button>
          <button type="button" class="btn btn--secondary" id="settings">Сервер солих…</button>
        </div>
      </div>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
