<!doctype html>
<!--
  Gerege Template Platform V3.0
  Gerege Systems Development Team болон Claude AI хамтран бүтээв, 2026.

  Ачаалах серверийг сонгох дотоод цонх (Cmd+Shift+S). Web аппын хэсэг БИШ.
-->
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Сервер солих</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main class="screen">
      <div class="card">
        <h1 class="screen__title">Сервер солих</h1>
        <p class="screen__lead">Апп аль хаягийн web интерфейсийг ачаалахыг сонгоно уу.</p>

        <div class="presets" id="presets"></div>

        <div class="field">
          <label class="field__label" for="url">Өөр хаяг</label>
          <input
            class="input"
            id="url"
            type="url"
            placeholder="https://public.template.gerege.mn"
            spellcheck="false"
          />
          <p class="field__error" id="error" role="alert"></p>
        </div>

        <div class="actions">
          <button type="button" class="btn btn--primary" id="save">Хадгалаад ачаалах</button>
          <button type="button" class="btn btn--secondary" id="cancel">Болих</button>
        </div>

        <p class="note" id="note" hidden>
          Анхаар: <code>GEREGE_APP_URL</code> орчны хувьсагч тогтоогдсон тул апп
          дахин эхлэхэд түүнийг ашиглана.
        </p>
      </div>
    </main>
    <script src="server.js"></script>
  </body>
</html>
