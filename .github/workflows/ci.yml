# Gerege Template — CI/CD pipeline
#
# Backend (Go): go vet + gofmt + go test -race + integration compile + build,
# мөн тусдаа job-д жинхэнэ Postgres/Redis дээр integration тест.
# Frontend (Next.js): lint + build. Secrets scan (gitleaks binary, no license).
# makefile-ийн `pre-push` target-уудтай ойролцоо.
#
# Тэмдэглэл: golangci-lint-action-ийг түр хассан — latest golangci-lint нь Go 1.24-ээр
# build хийгдсэн бөгөөд go.mod-ийн target Go 1.26-г "lower than targeted" гэж татгалздаг.
# golangci-lint Go 1.26-г дэмжсэн үед буцааж нэмнэ. Одоохондоо go vet + gofmt-ээр линт.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (vet · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt-аар форматлагдаагүй файлууд:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build binaries
        run: |
          go build ./cmd/api
          # migrate/seed/healthcheck нь open-gerege-core модульд байрлана —
          # энэ репод хуулбар байхгүй тул хамаарлаас шууд build хийнэ.
          go build github.com/gerege-systems/open-gerege-core/cmd/migration
          go build github.com/gerege-systems/open-gerege-core/cmd/seed
          go build github.com/gerege-systems/open-gerege-core/cmd/healthcheck

  # Integration тестүүд жинхэнэ Postgres/Redis дээр (testcontainers, runner-ийн
  # Docker-ыг ашиглана). Compile check нь эдгээрийг ЗӨВХӨН build хийдэг тул
  # ажиллуулдаггүй байсан — үр дүнд нь role ID дахин зурагдахад эрхийн matrix
  # тест чимээгүй утгаа алдаж, «user» persona админ болж хувирсныг хэн ч
  # анзаараагүй. Тиймээс одоо бодитоор ажиллуулна.
  # Backend-ийн integration тестүүд open-gerege-core repo-д шилжсэн (суурь код
  # тэнд байрлана). Энэ репо нь нимгэн апп тул өөрийн тесттэй болмогц энд
  # шинэ job нэмнэ.

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  # Desktop — macOS клиент (SwiftUI). xcodeproj нь repo-д байдаггүй тул эхлээд
  # xcodegen-ээр үүсгэнэ (эх сурвалж = project.yml + Sources/).
  desktop-macos:
    name: Desktop macOS (build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/macos-app
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project GeregeDesktop.xcodeproj \
            -scheme GeregeDesktop \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Desktop — Windows клиент (WinUI 3 · .NET).
  #
  # Энэ job нь заавал байх ёстой: WinUI project-ийг ЗӨВХӨН Windows дээр build
  # хийж болно (WindowsAppSDK-ийн target, XAML компилятор). Хөгжүүлэгч macOS /
  # Linux дээр байвал энэ нь цорын ганц компиляцын баталгаа болно.
  desktop-windows:
    name: Desktop Windows (build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/windows-app
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # XAML нь зөв XML эсэхийг ЭХЛЭЭД шалгана. XamlCompiler.exe нь буруу XML
      # дээр ямар ч мессежгүйгээр exit 1 өгдөг тул алдааг олоход маш их цаг
      # алддаг (жишээ нь XML тайлбар дотор `--` байж болдоггүй). Энэ алхам
      # тэр ангиллын алдааг шууд, ойлгомжтой барина.
      - name: Validate XAML is well-formed XML
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem -Recurse -Filter *.xaml | ForEach-Object {
            try { [xml](Get-Content $_.FullName -Raw) | Out-Null }
            catch { Write-Host "::error file=$($_.FullName)::$($_.Exception.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }

      - name: Restore
        run: dotnet restore GeregeDesktop.sln

      - name: Build
        run: dotnet build GeregeDesktop.sln --configuration Release --no-restore -p:Platform=x64

  # Mobile — Android клиент (Kotlin · Compose). Unit тест + debug APK.
  # ubuntu runner дээр Android SDK урьдчилан суусан байдаг тул нэмэлт татах
  # алхам шаардлагагүй; JDK-г л AGP 8.7-ийн шаарддаг 17 болгоно.
  mobile-android:
    name: Mobile Android (test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/TemplateApp
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

  # Mobile — iOS клиент (SwiftUI). xcodeproj нь repo-д байдаггүй тул эхлээд
  # xcodegen-ээр үүсгэнэ (эх сурвалж = project.yml + Sources/).
  mobile-ios:
    name: Mobile iOS (build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios/TemplateApp
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project TemplateApp.xcodeproj \
            -scheme TemplateApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # gitleaks-action@v2 нь org repo-д license шаарддаг тул binary-г шууд татаж
        # ажиллуулна (license-гүй).
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose --exit-code 1

  # CD: бүх шалгуур (backend · frontend · secrets) давсны дараа main-д push хийхэд
  # л ажиллана. VPS руу SSH-ээр орж тухайн commit-ийг татаж, docker compose stack-ийг
  # дахин build/restart хийгээд эрүүл болтол хүлээнэ (deploy/deploy.sh). Runbook:
  # docs/DEPLOYMENT.md. Шаардлагатай repo secrets: DEPLOY_HOST, DEPLOY_USER,
  # DEPLOY_SSH_KEY, DEPLOY_PATH (host дээрх checkout зам; хоосон бол
  # /srv/open-gerege-mn) — мөн заавал биш DEPLOY_PORT.
  deploy:
    name: Deploy (ssh · docker compose)
    needs: [backend, frontend, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy-ууд давхцахаас сэргийлнэ; ажиллаж буйг таслахгүй (build дундуур зогсоохгүй).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Template репод deploy хост тохируулагдаагүй — тэр үед алхам алгасна
    # (CI улаан болгохгүй). Бодит платформууд DEPLOY_HOST-той тул ажиллана.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/srv/open-gerege-mn' }}"
            git fetch --prune origin
            git reset --hard ${{ github.sha }}
            bash deploy/deploy.sh
