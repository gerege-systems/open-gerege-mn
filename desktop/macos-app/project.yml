# xcodegen тодорхойлолт — `xcodegen generate`-ээр .xcodeproj үүсгээд Xcode-оор
# нээнэ. (repo-д binary .xcodeproj хадгалахгүй; энэ нэг эх сурвалж.)
name: GeregeDesktop

options:
  bundleIdPrefix: mn.gerege
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  GeregeDesktop:
    type: application
    platform: macOS
    sources:
      - path: Sources
    # Нэвтрэлт нь зөвхөн Gerege SSO бөгөөд бүхэлдээ платформын BFF-ээр (WKWebView)
    # явна: native OIDC client, custom URL scheme БАЙХГҮЙ тул нэмэлт
    # тохиргоо шаардлагагүй. Info.plist-ийг xcodegen үүсгэнэ.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Gerege Template
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: © 2026 Gerege Systems
        # Апп зөвхөн HTTPS-ээр BFF рүү залгана — ATS-ийн сулралт хэрэггүй.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Sources/GeregeDesktop.entitlements
      properties:
        # App Sandbox — Mac App Store болон Gatekeeper-ийн жишиг.
        com.apple.security.app-sandbox: true
        # Гадагш чиглэсэн сүлжээ (BFF рүү) — цорын ганц шаардлагатай эрх.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.gerege.temp.desktop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
